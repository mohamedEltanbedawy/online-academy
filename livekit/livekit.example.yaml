# مثال لإعدادات LiveKit — انسخه لملف livekit.yaml واكتب مفاتيحك
# ⚠️ ملف livekit.yaml الحقيقي معمول له ignore ومش بيترفع على GitHub
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  enable_loopback_candidate: true

redis:
  address: redis:6379

keys:
  اكتب_المفتاح_العام_هنا: اكتب_المفتاح_الخاص_هنا

logging:
  level: info
